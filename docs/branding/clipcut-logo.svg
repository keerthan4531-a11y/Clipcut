<svg width="1800" height="560" viewBox="0 0 1800 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ClipCut">
  <title>ClipCut — premium mobile video editing</title>
  <defs>
    <linearGradient id="panel" x1="84" y1="66" x2="1718" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0C12"/>
      <stop offset="0.48" stop-color="#141A2A"/>
      <stop offset="1" stop-color="#191524"/>
    </linearGradient>
    <linearGradient id="panelStroke" x1="92" y1="82" x2="1710" y2="504" gradientUnits="userSpaceOnUse">
      <stop stop-color="#89B4FA" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#778096" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#CBA6F7" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="plate" x1="116" y1="102" x2="484" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#131A30"/>
      <stop offset="1" stop-color="#080C1A"/>
    </linearGradient>
    <linearGradient id="plateGlow" x1="300" y1="120" x2="300" y2="452" gradientUnits="userSpaceOnUse">
      <stop stop-color="#89B4FA" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#CBA6F7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blade" x1="196" y1="418" x2="404" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#89B4FA"/>
      <stop offset="1" stop-color="#CBA6F7"/>
    </linearGradient>
    <linearGradient id="word" x1="560" y1="170" x2="1300" y2="344" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F1E8"/>
      <stop offset="0.52" stop-color="#E4D8C2"/>
      <stop offset="1" stop-color="#CBA6F7"/>
    </linearGradient>
    <mask id="cut" maskUnits="userSpaceOnUse" x="116" y="102" width="368" height="368">
      <rect x="116" y="102" width="368" height="368" fill="white"/>
      <path d="M196 418L404 210" stroke="black" stroke-width="22" stroke-linecap="round"/>
    </mask>
  </defs>

  <!-- panel -->
  <rect x="24" y="30" width="1752" height="500" rx="64" fill="url(#panel)"/>
  <rect x="24.75" y="30.75" width="1750.5" height="498.5" rx="63.25" stroke="url(#panelStroke)" stroke-width="1.5"/>
  <path d="M74 110C214 86 392 86 520 116" stroke="#FFF8EC" stroke-opacity="0.05" stroke-width="2"/>
  <path d="M1252 446C1400 432 1574 436 1716 470" stroke="#FFF8EC" stroke-opacity="0.05" stroke-width="2"/>

  <!-- mark plate -->
  <rect x="116" y="102" width="368" height="368" rx="84" fill="url(#plate)"/>
  <rect x="116" y="102" width="368" height="368" rx="84" fill="url(#plateGlow)"/>
  <rect x="116.75" y="102.75" width="366.5" height="366.5" rx="83.25" stroke="#8FA0C8" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- mark: frame + holes, severed by the blade -->
  <g mask="url(#cut)" fill="#F5F1E8" transform="translate(116 102) scale(0.368)">
    <rect x="264" y="264" width="472" height="472" rx="78" fill="none" stroke="#F5F1E8" stroke-width="52"/>
    <rect x="347" y="352" width="52" height="52" rx="6"/>
    <rect x="474" y="352" width="52" height="52" rx="6"/>
    <rect x="601" y="352" width="52" height="52" rx="6"/>
    <rect x="347" y="596" width="52" height="52" rx="6"/>
    <rect x="474" y="596" width="52" height="52" rx="6"/>
    <rect x="601" y="596" width="52" height="52" rx="6"/>
  </g>
  <path d="M196 418L404 210" stroke="url(#blade)" stroke-width="14" stroke-linecap="round"/>

  <!-- divider -->
  <path d="M548 112V448" stroke="#8FA0C8" stroke-opacity="0.18" stroke-width="1.5"/>
  <path d="M566 140H1694" stroke="#F1DEBC" stroke-opacity="0.07" stroke-width="1.5"/>

  <!-- wordmark -->
  <text x="618" y="270" fill="url(#word)" font-family="'Georgia','Times New Roman',serif" font-size="168" font-weight="700" letter-spacing="-2">ClipCut</text>
  <text x="626" y="340" fill="#A9B0BC" font-family="'Segoe UI',Arial,sans-serif" font-size="36" font-weight="600" letter-spacing="7">PREMIUM MOBILE VIDEO EDITING</text>
  <path d="M626 382H1118" stroke="#89B4FA" stroke-opacity="0.7" stroke-width="3"/>
  <path d="M1142 382H1242" stroke="#CBA6F7" stroke-opacity="0.45" stroke-width="3"/>
</svg>
